<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRA — Impact Research &amp; Advisory</title>

<style>
/* =========================================================
   IRA — HERO
   ========================================================= */

*, *::before, *::after { box-sizing: border-box; }

:root{
  --ira-bg:     #f7f4ef;
  --ira-ink:    #101c2c;
  --ira-muted:  #5d6b7e;
  --ira-accent: #d9542f;
}

body{
  margin: 0;
  background: var(--ira-bg);
  color: var(--ira-ink);
  font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ---------- coquille du hero ---------- */
.ira-hero{
  display: flex;
  justify-content: center;
  padding:
    clamp(40px, 7vw, 110px)
    clamp(16px, 4vw, 40px)
    clamp(110px, 13vw, 180px);
}

/* ---------- scène : les 2 visuels collés ---------- */
.ira-hero__stage{
  container-type: inline-size;
  display: flex;
  align-items: flex-end;          /* bas des deux colonnes alignés */
  justify-content: center;
  gap: 0;                         /* AUCUN espace entre les images */
  width: min(100%, 900px);
}

/* ---------- visuels ---------- */
.ira-shot{
  position: relative;
  margin: 0;
  overflow: hidden;
  background: #e6e1d8;            /* placeholder pendant le chargement */
}

.ira-shot img{
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* --- image 1 : ingénieure, plus basse que la 2e --- */
.ira-shot--left{
  flex: 0 0 37.8%;                       /* 340 / 900 */
  aspect-ratio: 1432 / 1920;             /* ratio natif respecté */
  border-radius: 3px 0 0 3px;
  transform: translateY(clamp(28px, 6.6cqw, 60px));
}

/* --- le trait qui relie les deux images --- */
.ira-shot--left::after{
  content: "";
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 2px;
  background: linear-gradient(
    to bottom,
    rgba(217, 84, 47, 0)    0%,
    rgba(217, 84, 47, .85) 32%,
    var(--ira-accent)     100%
  );
  pointer-events: none;
}

/* --- image 2 : ouvriers / mise en œuvre --- */
.ira-shot--right{
  aspect-ratio: 4 / 3;
  border-radius: 0 3px 3px 0;
}

/* ---------- colonne de droite : texte + image + texte ---------- */
.ira-hero__col{
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: .65em;
  font-size: clamp(18px, 3.3cqw, 30px);
}

.ira-line{
  margin: 0;
  font-size: 1em;
  line-height: 1.15;
  letter-spacing: -.015em;
}

.ira-line--top{
  font-weight: 700;
  color: var(--ira-ink);
}

.ira-line--bottom{
  font-weight: 400;
  font-style: italic;
  color: var(--ira-muted);
  padding-left: .55em;   /* laisse respirer le trait vertical — supprimez si vous voulez un alignement strict */
}

/* =========================================================
   RESPONSIVE — sous 720px on empile
   ========================================================= */
@media (max-width: 720px){

  .ira-hero__stage{
    flex-direction: column;
    align-items: stretch;
  }

  .ira-shot--left{
    flex: 0 0 auto;
    width: 100%;
    aspect-ratio: 4 / 5;
    transform: none;                 /* plus de décalage vertical */
    border-radius: 3px 3px 0 0;
  }

  /* le trait devient horizontal, sous la 1re image */
  .ira-shot--left::after{
    top: auto; left: 0; right: 0; bottom: 0;
    width: auto;
    height: 2px;
    background: linear-gradient(
      to right,
      rgba(217, 84, 47, 0)    0%,
      rgba(217, 84, 47, .85) 60%,
      var(--ira-accent)     100%
    );
  }

  .ira-hero__col{
    font-size: clamp(19px, 6.5vw, 26px);
    padding-top: .9em;
  }

  .ira-shot--right{
    border-radius: 0 0 3px 3px;
  }
}
</style>
</head>

<body>

<section class="ira-hero">
  <div class="ira-hero__stage">

    <!-- IMAGE 1 — descendue par rapport à la 2e -->
    <figure class="ira-shot ira-shot--left">
      <img src="/images/woman-engineer.jpg"
           alt="Ingénieure IRA sur le terrain"
           width="1432" height="1920">
    </figure>

    <!-- COLONNE 2 : texte / image / texte -->
    <div class="ira-hero__col">

      <p class="ira-line ira-line--top">Des preuves solides</p>

      <figure class="ira-shot ira-shot--right">
        <img src="/images/workers-implementation.jpg"
             alt="Équipe de mise en œuvre sur le terrain">
      </figure>

      <p class="ira-line ira-line--bottom">pour des décisions qui comptent.</p>

    </div>

  </div>
</section>

</body>
</html>
