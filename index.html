<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRA — Impact Research &amp; Advisory</title>

<!-- ===== Google Fonts : Playball ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playball&display=swap" rel="stylesheet">

<style>
/* =========================================================
   IRA — HERO
   ========================================================= */

*, *::before, *::after { box-sizing: border-box; }

:root{
  --ira-bg:     #f7f4ef;
  --ira-ink:    #101c2c;
  --ira-accent: #d9542f;
  --ira-green:  #0a2e0a;   /* vert très foncé, proche du noir */
}

body{
  margin: 0;
  background: var(--ira-bg);
  color: var(--ira-ink);
  font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ---------- classe Playball (fournie) ---------- */
.playball-regular {
  font-family: "Playball", cursive;
  font-weight: 400;
  font-style: normal;
}

/* ---------- coquille du hero ---------- */
.ira-hero{
  display: flex;
  justify-content: center;
  padding:
    clamp(40px, 7vw, 110px)
    clamp(16px, 4vw, 40px)
    clamp(110px, 13vw, 180px);
}

/* ---------- scène : les 2 visuels collés ---------- */
.ira-hero__stage{
  container-type: inline-size;
  display: flex;
  align-items: flex-end;          /* bas des deux colonnes alignés */
  justify-content: center;
  gap: 0;                         /* AUCUN espace entre les images */
  width: min(100%, 900px);
}

/* ---------- colonnes ---------- */
.ira-hero__col{
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* Colonne gauche : texte + image 1
   → le décalage vers le bas est porté par la COLONNE,
     ce qui laisse la position de l’image identique à avant. */
.ira-hero__col--left{
  flex: 0 0 37.8%;                              /* 340 / 900 */
  gap: .45em;                                   /* espace texte ↔ image */
  transform: translateY(clamp(28px, 6.6cqw, 60px));  /* ← décalage conservé */
}

/* Colonne droite : image 2 + texte */
.ira-hero__col--right{
  flex: 1 1 auto;
  gap: .65em;
}

/* ---------- visuels ---------- */
.ira-shot{
  position: relative;
  margin: 0;
  overflow: hidden;
  background: #e6e1d8;            /* placeholder pendant le chargement */
}

.ira-shot img{
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* --- image 1 : ingénieure (reste plus basse) --- */
.ira-shot--left{
  width: 100%;
  aspect-ratio: 1432 / 1920;      /* ratio natif respecté */
  border-radius: 3px 0 0 3px;
}

/* --- trait de liaison entre les deux images --- */
.ira-shot--left::after{
  content: "";
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 2px;
  background: linear-gradient(
    to bottom,
    rgba(217, 84, 47, 0)    0%,
    rgba(217, 84, 47, .85) 32%,
    var(--ira-accent)     100%
  );
  pointer-events: none;
}

/* --- image 2 : ouvriers / mise en œuvre --- */
.ira-shot--right{
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: 0 3px 3px 0;
}

/* ---------- textes (Playball) ---------- */
.ira-line{
  margin: 0;
  font-family: "Playball", cursive;
  font-weight: 400;
  font-style: normal;
  color: #000000;
  line-height: 1.12;
  letter-spacing: 0;
  /* +5 % par rapport à la version précédente */
  font-size: clamp(21px, 3.8cqw, 36px);
}

/* Texte du bas : vert foncé + léger décalage vers la droite */
.ira-line--bottom{
  color: var(--ira-green);
  padding-left: 0.6em;   /* pousse le texte vers la droite */
}

/* =========================================================
   RESPONSIVE — sous 720px on empile
   ========================================================= */
@media (max-width: 720px){

  .ira-hero__stage{
    flex-direction: column;
    align-items: stretch;
  }

  .ira-hero__col--left,
  .ira-hero__col--right{
    flex: 0 0 auto;
    width: 100%;
  }

  /* plus de décalage vertical une fois empilé */
  .ira-hero__col--left{
    transform: none;
  }

  .ira-shot--left{
    aspect-ratio: 4 / 5;
    border-radius: 3px 3px 0 0;
  }

  /* le trait devient horizontal, sous la 1re image */
  .ira-shot--left::after{
    top: auto; left: 0; right: 0; bottom: 0;
    width: auto;
    height: 2px;
    background: linear-gradient(
      to right,
      rgba(217, 84, 47, 0)    0%,
      rgba(217, 84, 47, .85) 60%,
      var(--ira-accent)     100%
    );
  }

  .ira-shot--right{
    border-radius: 0 0 3px 3px;
  }

  /* +5 % également sur mobile */
  .ira-line{
    font-size: clamp(25px, 7.4vw, 36px);
  }
}
</style>
</head>

<body>

<section class="ira-hero">
  <div class="ira-hero__stage">

    <!-- COLONNE GAUCHE : « Des preuves solides » + image 1 -->
    <div class="ira-hero__col ira-hero__col--left">

      <p class="ira-line playball-regular">Des preuves solides</p>

      <figure class="ira-shot ira-shot--left">
        <img src="/images/woman-engineer.jpg"
             alt="Ingénieure IRA sur le terrain"
             width="1432" height="1920">
      </figure>

    </div>

    <!-- COLONNE DROITE : image 2 + « pour des décisions qui comptent. » -->
    <div class="ira-hero__col ira-hero__col--right">

      <figure class="ira-shot ira-shot--right">
        <img src="/images/workers-implementation.jpg"
             alt="Équipe de mise en œuvre sur le terrain">
      </figure>

      <p class="ira-line ira-line--bottom playball-regular">
        pour des décisions qui comptent.
      </p>

    </div>

  </div>
</section>

</body>
</html>
