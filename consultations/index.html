<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Glow</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #0d0d12;
      font-family: system-ui, sans-serif;
      transition: background 0.6s ease;
    }
    .card {
      padding: 2.5rem 3rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      color: #fff;
      box-shadow: 0 0 40px rgba(120, 80, 255, 0.35);
    }
    h1 { margin: 0 0 1rem; font-size: 1.4rem; letter-spacing: 1px; }
    button {
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 999px;
      background: #7c5cff;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    button:hover { transform: scale(1.08); }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="label">Click for a new vibe</h1>
    <button onclick="shuffle()">Shuffle</button>
  </div>

  <script>
    function shuffle() {
      const h = Math.floor(Math.random() * 360);
      document.body.style.background =
        `linear-gradient(135deg, hsl(${h},70%,12%), hsl(${(h + 60) % 360},70%,20%))`;
      document.getElementById('label').textContent =
        `Hue ${h}° — looking good`;
    }
    shuffle();
  </script>
</body>
</html>
